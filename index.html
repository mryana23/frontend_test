<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Page Selector</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="wrapper">
      <div class="modal">
        <div class="row">
          <span>All pages</span>
          <div class="wrap-checkbox">
            <div class="checkbox state-1">
              <div class="focus-ring"></div>
              <div class="rectangle"></div>
              <svg class="checkmark" width="15.64" height="11.04" viewBox="0 0 17 13">
                <path d="M0.5 6.572L6.04879 11.5072L16.14 0.5" />
              </svg>
            </div>
          </div>
        </div>

        <div class="line"><div class="border"></div></div>

        <div class="list-scroll">
          <!-- PAGE ITEMS -->
          <div class="row-page">
            <span>Page 1</span>
            <div class="wrap-checkbox">
              <div class="checkbox state-1">
                <div class="focus-ring"></div>
                <div class="rectangle"></div>
                <svg class="checkmark" width="15.64" height="11.04" viewBox="0 0 17 13">
                  <path d="M0.5 6.572L6.04879 11.5072L16.14 0.5" />
                </svg>
              </div>
            </div>
          </div>

          <div class="row-page"><span>Page 2</span><div class="wrap-checkbox"><div class="checkbox state-1"><div class="focus-ring"></div><div class="rectangle"></div><svg class="checkmark" width="15.64" height="11.04" viewBox="0 0 17 13"><path d="M0.5 6.572L6.04879 11.5072L16.14 0.5" /></svg></div></div></div>
          <div class="row-page"><span>Page 3</span><div class="wrap-checkbox"><div class="checkbox state-1"><div class="focus-ring"></div><div class="rectangle"></div><svg class="checkmark" width="15.64" height="11.04" viewBox="0 0 17 13"><path d="M0.5 6.572L6.04879 11.5072L16.14 0.5" /></svg></div></div></div>
          <div class="row-page"><span>Page 4</span><div class="wrap-checkbox"><div class="checkbox state-1"><div class="focus-ring"></div><div class="rectangle"></div><svg class="checkmark" width="15.64" height="11.04" viewBox="0 0 17 13"><path d="M0.5 6.572L6.04879 11.5072L16.14 0.5" /></svg></div></div></div>
          <div class="row-page"><span>Page 5</span><div class="wrap-checkbox"><div class="checkbox state-1"><div class="focus-ring"></div><div class="rectangle"></div><svg class="checkmark" width="15.64" height="11.04" viewBox="0 0 17 13"><path d="M0.5 6.572L6.04879 11.5072L16.14 0.5" /></svg></div></div></div>
          <div class="row-page"><span>Page 6</span><div class="wrap-checkbox"><div class="checkbox state-1"><div class="focus-ring"></div><div class="rectangle"></div><svg class="checkmark" width="15.64" height="11.04" viewBox="0 0 17 13"><path d="M0.5 6.572L6.04879 11.5072L16.14 0.5" /></svg></div></div></div>
        </div>

        <div class="line"><div class="border"></div></div>

        <div class="frame-btn">
          <button class="done-btn">Done</button>
        </div>
      </div>

      <div class="text">
        <span>Note:</span> Run the prototype to see what you should get as a result.
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
